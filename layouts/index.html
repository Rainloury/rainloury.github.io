{{ define "main" }}
<section class="hero">
  <h1 class="hero-title">{{ .Site.Title }}</h1>
  <p class="hero-sub">{{ .Site.Params.description }}</p>
  <div class="hero-content">{{ .Content }}</div>
</section>

<section class="posts">
  <div class="section-bar">
    <h2>最新文章</h2>
    <span class="more">
      <a href="{{ "posts/" | relURL }}">NAS 文章 &rarr;</a>
      <a href="{{ "network/" | relURL }}">网络 &rarr;</a>
      <a href="{{ "interview/" | relURL }}">面试 &rarr;</a>
    </span>
  </div>
  <div class="post-grid">
    {{ range first 6 .Site.RegularPages.ByDate.Reverse }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}
